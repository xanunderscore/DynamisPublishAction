on:
  workflow_call:
    inputs:
      plugin_id:
        type: number
        required: true
      internal_name:
        type: string
        required: true
      dotnet_version:
        type: string
        required: true
      project_file:
        type: string
        required: false
      dalamud_version:
        type: number
        required: true
      testing:
        type: boolean
        required: false
    secrets:
      publisher_key:
        required: true
    outputs:
      completed:
        description: "`'true'` if a new version was built and published."
        value: ${{ jobs.check_version.outputs.should_build }}
      version:
        value: ${{ jobs.check_version.outputs.local_version }}
      release_type:
        description: "`testing` or `latest`"
        value: ${{ jobs.check_version.outputs.release_type }}

jobs:
  check_version:
    runs-on: windows-latest
    outputs:
      should_build: ${{ steps.check_version.outputs.build }}
      project_file: ${{ steps.check_version.outputs.project_file }}
      local_version: ${{ steps.check_version.outputs.local_version }}
      remote_version: ${{ steps.check_version.outputs.remote_version }}
      release_type: ${{ steps.check_version.outputs.release_type }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup msbuild
        uses: microsoft/setup-msbuild@v3

      - name: Compare version with published
        id: check_version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          function say {
            param ([string]$contents)
            Write-Output "$contents" | Tee-Object -Append -FilePath $env:GITHUB_OUTPUT
          }

          $ProjectFile = "${{ inputs.project_file }}"

          if (!$ProjectFile) {
              $candidates = @(Get-ChildItem -Path '.' -Filter '*.csproj' -Recurse | ForEach-Object { $_.FullName })

              if ($candidates.Count -ne 1) {
                  Write-Error "Configuration error: project_file was not specified and more than one .csproj was found in the repository."
              }

              $ProjectFile = $candidates[0]
          }

          say "project_file=$ProjectFile"

          $LocalVersion = msbuild -getProperty:Version $ProjectFile
          say "local_version=$LocalVersion"

          $ReleaseType = "latest"
          if ('${{ inputs.testing }}' -eq 'true') {
            $ReleaseType = "testing"
          }
          say "release_type=$ReleaseType"

          $VersionLatest = [Version](Invoke-WebRequest -Uri "https://puni.sh/api/plugins/${{ inputs.plugin_id }}/${{ inputs.internal_name }}/versions/latest" -ContentType "text/plain" -UseBasicParsing).Content
          $VersionTesting = [Version](Invoke-WebRequest -Uri "https://puni.sh/api/plugins/${{ inputs.plugin_id }}/${{ inputs.internal_name }}/versions/testing" -ContentType "text/plain" -UseBasicParsing).Content

          $VersionActual = if ($VersionTesting -gt $VersionLatest) { $VersionTesting } else { $VersionLatest }
          say "remote_version=$VersionActual"

          if ($LocalVersion -gt $VersionActual) {
            say "build=true"
          } else {
            say "build=false"
          }

  build:
    runs-on: ubuntu-latest
    needs: check_version
    env:
      DALAMUD_HOME: /tmp/dalamud
    if: needs.check_version.outputs.should_build == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
          
      - name: Download Dalamud Latest
        run: |
          wget https://goatcorp.github.io/dalamud-distrib/latest.zip -O ${{ env.DALAMUD_HOME }}.zip
          unzip ${{ env.DALAMUD_HOME }}.zip -d ${{ env.DALAMUD_HOME }}

      - name: Compile
        run: |
          dotnet restore
          dotnet publish ${{ needs.check_version.outputs.project_file }} -o /tmp/plugin-build
          cp $(find /tmp/plugin-build -name latest.zip) /tmp/latest.zip
          unzip -l /tmp/latest.zip

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: latest_zip
          path: /tmp/latest.zip

  publish:
    runs-on: ubuntu-latest
    needs:
      - check_version
      - build
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: latest_zip

      - name: Publish new release
        uses: PunishXIV/dynamis-action@v1
        with:
          plugin_id: ${{ inputs.plugin_id }}
          internal_name: ${{ inputs.internal_name }}
          version_number: ${{ needs.check_version.outputs.local_version }}
          path: latest.zip
          type: ${{ inputs.testing && 'testing' || 'latest' }}
          dalamud_version: ${{ inputs.dalamud_version }}
        env:
          PUBLISHER_KEY: ${{ secrets.publisher_key }}
